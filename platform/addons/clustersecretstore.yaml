apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: notch-secret-store
  annotations:
    # After the external-secrets chart (wave 0) so the CRD exists.
    # This was previously a bare top-level key, which the API server silently
    # pruned - the wave never took effect.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          # IRSA role notch-eso, attached by eksctl in notch/cluster.yaml.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
