apiVersion: v1
kind: Namespace
metadata:
  name: platform-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# Superuser secret notch-pg-superuser comes from the cluster folder:
#   aws:  clusters/aws/infra/pg-superuser.yaml (ExternalSecret)
#   kind: created by scripts/kind-up.sh
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: notch-pg
  namespace: platform-db
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Stateful: never let a pruned manifest take the PVCs with it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  enableSuperuserAccess: true
  superuserSecret:
    name: notch-pg-superuser
  storage:
    # No storageClass: uses the cluster default, which each cluster sets to its
    # cheapest option (kind: standard, aws: gp3). Set one here to override.
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
