apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    # Ahead of everything: the Providers in platform/addons/crossplane (wave 1)
    # and every Crossplane CR in platform/addons/infra need these CRDs first.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    # 1.x deliberately. Crossplane 2.x moves managed resources to namespaced
    # APIs and needs provider-upjet-aws v2.x; the manifests here are v1-style.
    targetRevision: "1.20.11"
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
