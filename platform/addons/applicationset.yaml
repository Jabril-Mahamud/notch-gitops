apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: notch-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: [ "missingkey=error" ]
  generators:
  - git:
      repoURL: https://github.com/Jabril-Mahamud/notch-gitops.git
      revision: HEAD
      # For the files generator, .path is the DIRECTORY holding the match, so
      # services/notch/dev/values.yaml gives segments [services, notch, dev]:
      #   index 1 = service name, index 2 = env.
      files:
      - path: "services/*/*/values.yaml"
  template:
    metadata:
      name: '{{index .path.segments 1}}-{{index .path.segments 2}}'
    spec:
      project: default
      sources:
      - repoURL: https://github.com/Jabril-Mahamud/notch.git
        targetRevision: HEAD
        path: charts/notch-app
        helm:
          # ignoreMissingValueFiles is deliberately OFF. It previously hid a
          # misnamed services/notch/services.yaml and rendered a nameless
          # Deployment instead of failing.
          ignoreMissingValueFiles: false
          valueFiles:
          - $values/envs/{{index .path.segments 2}}/services.common.yaml
          - $values/services/{{index .path.segments 1}}/service.yaml
          - $values/services/{{index .path.segments 1}}/{{index .path.segments 2}}/values.yaml
      - repoURL: https://github.com/Jabril-Mahamud/notch-gitops.git
        targetRevision: HEAD
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 1}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
